name: Validate UI build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test profile library and AD4 motion settings
        run: node --test tests/*.test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Test local printer manager bridge
        run: python3 -m unittest discover -s tests -p 'test_printer_manager_bridge.py'

  security:
    name: Test Cloudflare Access origin checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JWT validation dependencies
        run: python -m pip install 'PyJWT[crypto]'
      - name: Run bridge and Access security tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
